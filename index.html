<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Início</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
    }
    .header-actions {
      display: flex;
      gap: 0.5rem;
    }
    .header-select {
      font-family: inherit;
      outline: none;
    }
    .header-select:focus-visible {
      border-color: var(--accent);
    }
    .header-select option {
      background: var(--card-bg);
      color: var(--text);
    }
    .search-input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .dashboard-error {
      margin: -1.25rem 0 1.5rem;
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }
    .url-groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .url-groups .project-group {
      margin-bottom: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2rem;
    }
    .section-title {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .project-group {
      margin-bottom: 1.25rem;
      background: color-mix(in srgb, var(--card-bg) 50%, transparent);
      border-radius: 8px;
      padding: 0.75rem;
      border: 1px solid var(--border);
    }
    .project-group-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 0.5rem;
      padding-left: 0.25rem;
    }
    .sub-list, .list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.9rem;
      background: var(--card-bg);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .item-card:hover, .item-card:focus-visible {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .item-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .item-row {
      position: relative;
    }
    /* Selo no canto do card, para não cobrir o contador */
    .item-hide {
      position: absolute;
      top: -0.4rem;
      right: -0.4rem;
      width: 1.25rem;
      height: 1.25rem;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }
    /* Só o card, e não as páginas encontradas abaixo dele, mostra o ×: ele oculta o item inteiro */
    .item-card:hover + .item-hide, .item-hide:hover, .item-hide:focus-visible {
      opacity: 1;
    }
    .item-hide:hover, .item-hide:focus-visible {
      color: var(--danger);
      border-color: var(--danger);
      outline: none;
    }
    .item-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      margin-right: 1rem;
    }
    .item-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .item-name, .item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-name {
      font-weight: 500;
    }
    .item-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }
    .item-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: color-mix(in srgb, var(--text) 5%, transparent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .item-name mark, .item-title mark, .item-page-title mark {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
      color: inherit;
      border-radius: 2px;
    }
    /* Páginas encontradas pela busca, alinhadas ao texto do card (ícone de 32px + espaço) */
    .item-pages {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      margin: 0.2rem 0 0.1rem calc(0.9rem + 32px + 0.75rem - 0.5rem);
    }
    .item-page {
      display: flex;
      gap: 0.4rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .item-page::before {
      content: '↳';
      flex-shrink: 0;
    }
    .item-page:hover, .item-page:focus-visible {
      background: var(--card-hover);
      color: var(--text);
    }
    .item-page:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .item-page-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-page-count {
      flex-shrink: 0;
      margin-left: 0.6rem;
    }
    .list-toggle {
      align-self: flex-start;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
    }
    .list-toggle:hover, .list-toggle:focus-visible {
      color: var(--accent);
      outline: none;
      text-decoration: underline;
    }

    /* Janela dividida ao meio ou tela estreita: uma coluna e header que quebra linha */
    @media (max-width: 760px) {
      body {
        padding: 1.5rem 1rem;
      }
      header {
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .header-actions {
        flex-wrap: wrap;
      }
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .url-groups {
        grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
      }
    }
  </style>
  <!-- Gerado pelo matugen a partir do papel de parede; sobrescreve as cores de common.css -->
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="page-title">Visão Geral · 1 mês</h1>
      <div class="header-actions">
        <select id="sort-select" class="btn header-select" aria-label="Ordenação"
          title="Ordem dos itens: mais visitados, frequentes e recentes (visitas recentes valem mais) ou último acesso"></select>
        <select id="period-select" class="btn header-select" aria-label="Período do histórico"
          title="Período do histórico (o Chrome costuma guardar só os últimos 90 dias)"></select>
        <button id="open-hidden-btn" class="btn" hidden>⊘ Ocultos</button>
        <button id="open-settings-btn" class="btn">⚙ Configurações</button>
      </div>
    </header>

    <input type="search" id="search-input" class="search-input"
      placeholder="Buscar por URL ou título… (/)" aria-label="Buscar por URL ou título" autofocus autocomplete="off" spellcheck="false" />
    <p id="dashboard-error" class="error-msg dashboard-error" role="alert" hidden></p>

    <section id="url-groups-section" hidden>
      <div class="section-title">Agrupamentos</div>
      <div id="url-groups" class="url-groups"></div>
    </section>

    <div class="grid">
      <div>
        <div class="section-title">Repositórios Git</div>
        <div id="git-repos" class="list"></div>
      </div>
      <div>
        <div class="section-title">Domínios Mais Acessados</div>
        <div id="top-domains" class="list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
